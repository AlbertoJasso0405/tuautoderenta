<!-- SDK e Integración Directa con Firebase -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getFirestore, collection, addDoc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDummyKeyForPublicAccess",
            authDomain: "tu-auto-de-renta.firebaseapp.com",
            projectId: "tu-auto-de-renta",
            storageBucket: "tu-auto-de-renta.appspot.com",
            messagingSenderId: "100000000000",
            appId: "1:100000000000:web:dummyappid"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        const destinos = [
            "Acapulco", "CDMX / Aeropuerto", "Cancún", "Chihuahua", "Ciudad Juárez", 
            "Ciudad Obregón", "Culiacán", "Durango", "Guadalajara", 
            "Hermosillo", "Huatulco", "Ixtapa", "La Paz", 
            "León", "Loreto", "Los Cabos", "Mazatlán", "Mexicali", 
            "Monterrey", "Mérida", "Oaxaca", "Puebla", "Puerto Vallarta", 
            "Querétaro", "San Luis Potosí", "Tijuana", "Toluca", "Torreón", 
            "Tuxtla Gutiérrez", "Veracruz", "Villahermosa"
        ];

        const grid = document.getElementById('destinos-grid');
        destinos.sort().forEach(dest => {
            const btn = document.createElement('button');
            btn.type = "button";
            btn.className = "city-card bg-white p-4 rounded-xl border border-slate-200 text-center font-black text-slate-600 uppercase text-[9px] tracking-widest transition-all hover:border-orange-500 hover:text-orange-500 cursor-pointer";
            btn.innerText = dest;
            btn.onclick = () => {
                const selectDestino = document.getElementById('res_destino');
                selectDestino.value = dest;
                irACotizarFormulario();
            };
            grid.appendChild(btn);
        });

        const hoy = new Date().toISOString().split('T')[0];
        document.getElementById('res_fecha_ini').min = hoy;
        document.getElementById('res_fecha_fin').min = hoy;

        window.toggleSolicitudesEspeciales = function(mostrar) {
            const cont = document.getElementById('contenedor-solicitudes-especiales');
            if (mostrar) {
                cont.classList.remove('hidden');
            } else {
                cont.classList.add('hidden');
                document.getElementById('chk_silla_bebe').checked = false;
                document.getElementById('chk_conductor_adicional').checked = false;
                document.getElementById('chk_conductor_menor').checked = false;
                document.getElementById('chk_combustible').checked = false;
                document.getElementById('txt_otras_solicitudes').value = '';
            }
        };

        window.cambiarPestana = function(idPestana) {
            document.querySelectorAll('.pestana-contenido').forEach(el => el.classList.add('hidden'));
            document.querySelectorAll('.btn-tab').forEach(btn => {
                btn.className = 'btn-tab bg-white text-slate-700 hover:bg-slate-100 px-4 py-2 rounded-xl text-xs font-black uppercase tracking-wider transition-all border border-slate-300';
            });

            const pestanaActiva = document.getElementById(`pestana-${idPestana}`);
            const btnActivo = document.getElementById(`tab-${idPestana}`);

            if (pestanaActiva) pestanaActiva.classList.remove('hidden');
            if (btnActivo) btnActivo.className = 'btn-tab bg-blue-900 text-white px-4 py-2 rounded-xl text-xs font-black uppercase tracking-wider transition-all shadow-sm';

            window.scrollTo({ top: 0, behavior: 'smooth' });
        };

        window.irACotizarFormulario = function() {
            cambiarPestana('inicio');
            setTimeout(() => {
                const el = document.getElementById('cuadro-reserva');
                if (el) {
                    el.scrollIntoView({ behavior: 'smooth', block: 'start' });
                }
            }, 100);
        };

        window.cambiarFoto = function(idCarrusel, direccion) {
            const contenedor = document.getElementById(idCarrusel);
            const imagenes = contenedor.querySelectorAll('.carrusel-img');
            const dots = contenedor.querySelectorAll('.dots span');
            let indexActual = 0;

            imagenes.forEach((img, idx) => {
                if (!img.classList.contains('hidden')) indexActual = idx;
            });

            imagenes[indexActual].classList.add('hidden');
            dots[indexActual].className = 'w-2 h-2 rounded-full bg-white/50';

            let nuevoIndex = indexActual + direccion;
            if (nuevoIndex >= imagenes.length) nuevoIndex = 0;
            if (nuevoIndex < 0) nuevoIndex = imagenes.length - 1;

            imagenes[nuevoIndex].classList.remove('hidden');
            dots[nuevoIndex].className = 'w-2 h-2 rounded-full bg-orange-500';
        };

        window.seleccionarAuto = function(valorAuto) {
            const selectAuto = document.getElementById('res_auto');
            selectAuto.value = valorAuto;
            irACotizarFormulario();
        };

        document.getElementById('reserva-form').onsubmit = async function(e) {
            e.preventDefault();
            
            const nombre = document.getElementById('res_nombre').value.trim();
            const telefono = document.getElementById('res_telefono').value.trim();
            const destino = document.getElementById('res_destino').value;
            const auto = document.getElementById('res_auto').value;
            const f_ini = document.getElementById('res_fecha_ini').value;
            const h_ini = document.getElementById('res_hora_ini').value;
            const f_fin = document.getElementById('res_fecha_fin').value;
            const h_fin = document.getElementById('res_hora_fin').value;

            if (telefono.replace(/\D/g, '').length < 10) {
                alert("Por favor ingresa un número de teléfono válido de 10 dígitos.");
                return;
            }

            const requiereEspeciales = document.querySelector('input[name="solicitud_especial_toggle"]:checked').value === 'si';
            let extras = [];

            if (requiereEspeciales) {
                if (document.getElementById('chk_silla_bebe').checked) extras.push("Silla de Bebé");
                if (document.getElementById('chk_conductor_adicional').checked) extras.push("Conductor Adicional");
                if (document.getElementById('chk_conductor_menor').checked) extras.push("Conductor Menor de Edad");
                if (document.getElementById('chk_combustible').checked) extras.push("Combustible Prepagado");
                
                const otrosTxt = document.getElementById('txt_otras_solicitudes').value.trim();
                if (otrosTxt) extras.push(`Otros: ${otrosTxt}`);
            }

            const listaExtrasStr = extras.length > 0 ? extras.join(", ") : "Ninguna";

            try {
                await addDoc(collection(db, "reservas_web"), {
                    nombre: nombre,
                    telefono: telefono,
                    destino: destino,
                    auto: auto,
                    fecha_entrega: `${f_ini} ${h_ini}`,
                    fecha_devolucion: `${f_fin} ${h_fin}`,
                    solicitudes_especiales: listaExtrasStr,
                    fecha_registro: new Date().toISOString()
                });
            } catch (err) {
                console.error("Error guardando reserva:", err);
            }

            const txt = `*¡Hola Jasso Mobility! Quiero una cotización con Atención VIP* 🚗✨\n\n` +
                        `👤 *Nombre:* ${nombre}\n` +
                        `📱 *WhatsApp:* ${telefono}\n` +
                        `📍 *Destino:* ${destino}\n` +
                        `🚘 *Vehículo:* ${auto}\n` +
                        `📅 *Entrega:* ${f_ini} a las ${h_ini} hrs.\n` +
                        `📅 *Devolución:* ${f_fin} a las ${h_fin} hrs.\n` +
                        `✨ *Solicitudes Especiales:* ${listaExtrasStr}\n\n` +
                        `_Generado automáticamente desde mi cotización web._`;

            localStorage.setItem('wa_mensaje_reserva', txt);
            window.location.href = "gracias.html";
        };
    </script>
