<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tu Auto de Renta | Motor de Reservaciones Oficial</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body { font-family: 'Outfit', sans-serif; scroll-behavior: smooth; background-color: #ffffff; }
        .hero-gradient { background: linear-gradient(135deg, #1e3a8a 0%, #172554 100%); }
    </style>
</head>
<body class="bg-slate-50 text-slate-900 pb-20 md:pb-0">

    <!-- NAVBAR -->
    <nav class="sticky top-0 z-50 bg-slate-900/95 backdrop-blur-md text-white border-b border-slate-800 py-3 px-4 shadow-lg">
        <div class="max-w-6xl mx-auto flex justify-between items-center">
            <button onclick="irACotizarFormulario()" class="flex items-center gap-3 focus:outline-none group">
                <span class="font-black text-xs uppercase tracking-widest text-slate-200">Tu Auto de Renta</span>
            </button>
            <div class="flex items-center gap-2 sm:gap-6 text-[10px] sm:text-xs font-bold uppercase tracking-wider">
                <button onclick="irACotizarFormulario()" class="text-orange-400 hover:text-orange-300">Cotizar</button>
                <button onclick="cambiarPestana('flota')" class="hover:text-orange-400">Flota</button>
                <button onclick="cambiarPestana('requisitos')" class="hover:text-orange-400">Requisitos</button>
                <button onclick="cambiarPestana('coberturas')" class="hover:text-orange-400">Coberturas</button>
            </div>
        </div>
    </nav>

    <!-- CONTENIDO PRINCIPAL -->
    <main class="min-h-[600px]">
        <section class="pestana-contenido hero-gradient text-white py-12 px-4" id="pestana-inicio">
            <div class="max-w-6xl mx-auto grid md:grid-cols-2 gap-8 items-center">
                <div>
                    <h1 class="text-4xl md:text-5xl font-black mb-6 leading-[1.1]">Más que un auto, te damos tranquilidad.</h1>
                    <p class="text-base text-blue-100/90 mb-6 font-light">
                        Reserva de forma rápida, segura y con un asesor personal asignado por WhatsApp para acompañarte en tu viaje.
                    </p>
                </div>

                <!-- Panel de Reservación -->
                <div class="bg-white rounded-[2.5rem] p-6 md:p-8 shadow-2xl text-slate-800 relative" id="cuadro-reserva">
                    <div class="flex justify-between items-center mb-6">
                        <h2 class="font-black text-xl uppercase tracking-tighter text-blue-900">Reservar Ahora</h2>
                        <span class="bg-orange-100 text-orange-600 px-3 py-1 rounded-full text-[10px] font-black uppercase">VIP</span>
                    </div>

                    <form id="reserva-form" class="space-y-4" onsubmit="event.preventDefault(); procesarReservaLocal();">
                        <div>
                            <label class="block text-[10px] font-black text-slate-400 uppercase tracking-widest mb-1">Nombre y Apellidos</label>
                            <input type="text" id="res_nombre" required placeholder="Ej. Juan Pérez García" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-3 font-bold text-slate-700 outline-none focus:ring-2 focus:ring-orange-500">
                        </div>

                        <div>
                            <label class="block text-[10px] font-black text-slate-400 uppercase tracking-widest mb-1">Teléfono WhatsApp</label>
                            <input type="tel" id="res_telefono" required placeholder="Ej. 5512345678" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-3 font-bold text-slate-700 outline-none focus:ring-2 focus:ring-orange-500">
                        </div>

                        <div class="grid grid-cols-2 gap-4">
                            <div>
                                <label class="block text-[10px] font-black text-slate-400 uppercase tracking-widest mb-1">Destino</label>
                                <select id="res_destino" required class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-3 font-bold text-slate-700 outline-none">
                                    <option value="">Seleccionar...</option>
                                    <option value="CDMX / Aeropuerto">CDMX / Aeropuerto</option>
                                    <option value="Cancún">Cancún</option>
                                    <option value="Guadalajara">Guadalajara</option>
                                    <option value="Mérida">Mérida</option>
                                    <option value="Monterrey">Monterrey</option>
                                    <option value="Los Cabos">Los Cabos</option>
                                    <option value="Pachuca / Hidalgo">Pachuca / Hidalgo</option>
                                    <option value="Tizayuca">Tizayuca</option>
                                </select>
                            </div>
                            <div>
                                <label class="block text-[10px] font-black text-slate-400 uppercase tracking-widest mb-1">Vehículo</label>
                                <select id="res_auto" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-3 font-bold text-slate-700 outline-none">
                                    <option value="Económico (Hyundai i10)">Económico (i10)</option>
                                    <option value="Mediano (Mirage G4)">Mediano (Mirage)</option>
                                    <option value="Estándar (Versa / K3)">Estándar (Versa / K3)</option>
                                    <option value="Grande (Kia K4 / Sentra)">Grande (K4 / Sentra)</option>
                                    <option value="Van (Hiace / Urvan)">Van (Hiace / Urvan)</option>
                                </select>
                            </div>
                        </div>

                        <div class="grid grid-cols-2 gap-4">
                            <div>
                                <label class="block text-[10px] font-black text-slate-400 uppercase tracking-widest mb-1">Fecha Entrega</label>
                                <input type="date" id="res_fecha_ini" required class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-2.5 font-bold text-slate-700 text-xs">
                            </div>
                            <div>
                                <label class="block text-[10px] font-black text-slate-400 uppercase tracking-widest mb-1">Fecha Devolución</label>
                                <input type="date" id="res_fecha_fin" required class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-2.5 font-bold text-slate-700 text-xs">
                            </div>
                        </div>

                        <button type="submit" id="btn-submit" class="w-full bg-orange-500 hover:bg-orange-600 text-white font-black py-4 rounded-2xl transition-all shadow-lg uppercase text-xs tracking-widest flex items-center justify-center gap-3 mt-4 cursor-pointer">
                            <i class="fab fa-whatsapp text-lg"></i> Reservar con Atención VIP ✨
                        </button>
                    </form>
                </div>
            </div>
        </section>
    </main>

    <script>
        document.addEventListener("DOMContentLoaded", function() {
            const hoy = new Date().toISOString().split('T')[0];
            document.getElementById('res_fecha_ini').value = hoy;
            document.getElementById('res_fecha_fin').value = hoy;
        });

        function procesarReservaLocal() {
            const nombre = document.getElementById('res_nombre').value.trim();
            const telefono = document.getElementById('res_telefono').value.trim();
            const destino = document.getElementById('res_destino').value;
            const auto = document.getElementById('res_auto').value;
            const f_ini = document.getElementById('res_fecha_ini').value;
            const f_fin = document.getElementById('res_fecha_fin').value;

            const nuevaReserva = {
                id: Date.now(),
                nombre: nombre,
                telefono: telefono,
                destino: destino,
                auto: auto,
                fecha_entrega: f_ini,
                fecha_devolucion: f_fin,
                fecha_registro: new Date().toLocaleString("es-MX")
            };

            // Guardar en almacenamiento global compartido simulado
            let reservas = JSON.parse(localStorage.getItem('jasso_reservas_globales') || '[]');
            reservas.unshift(nuevaReserva);
            localStorage.setItem('jasso_reservas_globales', JSON.stringify(reservas));

            // Generar enlace WhatsApp
            const txt = `*¡Hola Jasso Mobility! Quiero una cotización con Atención VIP* 🚗✨\n\n` +
                        `👤 *Nombre:* ${nombre}\n` +
                        `📱 *WhatsApp:* ${telefono}\n` +
                        `📍 *Destino:* ${destino}\n` +
                        `🚘 *Vehículo:* ${auto}\n` +
                        `📅 *Fechas:* ${f_ini} al ${f_fin}\n\n` +
                        `_Generado automáticamente desde mi cotización web._`;

            localStorage.setItem('wa_mensaje_reserva', txt);
            window.location.href = "gracias.html";
        }
    </script>
</body>
</html>
